<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <defs>
    <linearGradient id="yujiroBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2A55"/>
      <stop offset="50%" stop-color="#FF5400"/>
      <stop offset="100%" stop-color="#800F2F"/>
    </linearGradient>
    <radialGradient id="ogreGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FF2A55" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tbar"><rect x="1.5" y="1.5" width="797" height="39" rx="8.5"/></clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="797" height="257" rx="10" fill="#0D1117" stroke="url(#yujiroBorder)" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="797" height="257" rx="10" fill="url(#ogreGlow)"/>

  <!-- Title bar -->
  <rect x="1.5" y="1.5" width="797" height="39" fill="#161B22" clip-path="url(#tbar)"/>
  <line x1="1.5" y1="40.5" x2="798.5" y2="40.5" stroke="#30363D" stroke-width="1"/>
  <circle cx="26" cy="20.5" r="6" fill="#FF2A55"/>
  <circle cx="47" cy="20.5" r="6" fill="#FF6B35"/>
  <circle cx="68" cy="20.5" r="6" fill="#FFB703"/>
  <text x="400" y="25" text-anchor="middle" font-size="12.5" fill="#8B949E">akash@nixos: ~</text>

  <!-- FUN_FACT -->
  <text x="28" y="72" font-size="14"><tspan fill="#FF2A55" font-weight="700">akash@nixos:~$</tspan><tspan fill="#E6EDF3"> echo $FUN_FACT</tspan></text>
  <!-- Line 1 of fun fact -->
  <text x="28" y="96" font-size="13" fill="#8B949E">
    <tspan fill="#FF5400" font-weight="700">» </tspan>I train AI/ML models, architect Web3/Blockchain DApps,
  </text>
  <!-- Line 2 of fun fact -->
  <text x="28" y="115" font-size="13" fill="#8B949E">
    <tspan dx="12">build 3D worlds in Unreal, and craft MERN apps on NixOS!</tspan>
  </text>

  <!-- CURRENT_STATUS -->
  <text x="28" y="150" font-size="14"><tspan fill="#FF2A55" font-weight="700">akash@nixos:~$</tspan><tspan fill="#E6EDF3"> echo $CURRENT_STATUS</tspan></text>
  <!-- Line 1 of status -->
  <text x="28" y="174" font-size="13" fill="#8B949E">
    <tspan fill="#FF2A55" font-weight="700">» </tspan>Ready to battle &amp; ship code: Open for AI/ML engineering,
  </text>
  <!-- Line 2 of status -->
  <text x="28" y="193" font-size="13" fill="#8B949E">
    <tspan dx="12">Web3 protocols &amp; high-impact development.</tspan>
  </text>

  <!-- Cursor -->
  <text x="28" y="230" font-size="14"><tspan fill="#FF2A55" font-weight="700">akash@nixos</tspan><tspan fill="#E6EDF3">:~$ </tspan><tspan fill="#FF2A55" font-weight="700">█<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
</svg>
