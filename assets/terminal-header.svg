<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <defs>
    <linearGradient id="yujiroBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2A55"/>
      <stop offset="50%" stop-color="#FF5400"/>
      <stop offset="100%" stop-color="#800F2F"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2A55"/>
      <stop offset="50%" stop-color="#FF5400"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>
    <linearGradient id="flameUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="60%" stop-color="#FF2A55"/>
      <stop offset="100%" stop-color="#FF000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ogreGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FF2A55" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="borderPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2A55" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.4;0" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF5400" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tbar"><rect x="1.5" y="1.5" width="797" height="39" rx="8.5"/></clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="1.5" y="1.5" width="797" height="437" rx="10" fill="#0D1117" stroke="url(#yujiroBorder)" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="797" height="437" rx="10" fill="url(#ogreGlow)"/>

  <!-- Pulsing glow border overlay -->
  <rect x="1.5" y="1.5" width="797" height="437" rx="10" fill="none" stroke="#FF2A55" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Title Bar -->
  <rect x="1.5" y="1.5" width="797" height="39" fill="#161B22" clip-path="url(#tbar)"/>
  <line x1="1.5" y1="40.5" x2="798.5" y2="40.5" stroke="#30363D" stroke-width="1"/>
  <circle cx="26" cy="20.5" r="6" fill="#FF2A55"><animate attributeName="r" values="6;7;6" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="47" cy="20.5" r="6" fill="#FF6B35"/>
  <circle cx="68" cy="20.5" r="6" fill="#FFB703"/>
  <text x="400.0" y="25" text-anchor="middle" font-size="12.5" fill="#8B949E">akash@nixos: ~/profile 🔥</text>

  <!-- Booting sequence -->
  <text x="28" y="70" font-size="14"><tspan fill="#FF2A55" font-weight="700">$</tspan><tspan fill="#E6EDF3"> ./init.sh --profile</tspan></text>
  <text x="28" y="94" font-size="14"><tspan fill="#FF2A55" font-weight="700">[  OK  ]</tspan><tspan fill="#8B949E"> Mounted /dev/nvme0n1p2 on /home/akashbiswas.</tspan></text>
  <text x="28" y="118" font-size="14"><tspan fill="#FF2A55" font-weight="700">[  OK  ]</tspan><tspan fill="#8B949E"> Initialized NixOS 26.11 (Zokor) flake environment.</tspan></text>
  <text x="28" y="142" font-size="14"><tspan fill="#FF2A55" font-weight="700">[  OK  ]</tspan><tspan fill="#8B949E"> Started ai-ml-developer.service (PyTorch, TensorFlow, LLMs).</tspan></text>
  <text x="28" y="166" font-size="14"><tspan fill="#FF2A55" font-weight="700">[  OK  ]</tspan><tspan fill="#8B949E"> Initialized Blockchain &amp; Web3, Full-Stack MERN &amp; Mobile.</tspan></text>
  <text x="28" y="190" font-size="14"><tspan fill="#FF2A55" font-weight="700">[  OK  ]</tspan><tspan fill="#8B949E"> 3D Game Dev (Unreal, Unity) &amp; UI/UX system operational.</tspan></text>

  <!-- ASCII AKASH with fire gradient -->
  <g xml:space="preserve" font-size="18" font-weight="700" fill="url(#fireGrad)" filter="url(#glow)">
    <text x="28" y="214"> █████╗ ██╗  ██╗ █████╗ ███████╗██╗  ██╗</text>
    <text x="28" y="235">██╔══██╗██║ ██╔╝██╔══██╗██╔════╝██║  ██║</text>
    <text x="28" y="256">███████║█████╔╝ ███████║███████╗███████║</text>
    <text x="28" y="277">██╔══██║██╔═██╗ ██╔══██║╚════██║██╔══██║</text>
    <text x="28" y="298">██║  ██║██║  ██╗██║  ██║███████║██║  ██║</text>
    <text x="28" y="319">╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝</text>
  </g>

  <!-- Subtitle -->
  <text x="28" y="355" font-size="12.5"><tspan fill="#FF2A55" font-weight="700">»</tspan><tspan fill="#8B949E"> AI/ML Developer | Blockchain &amp; Web3 | MERN &amp; Mobile | 3D Game Dev | Cloud &amp; NixOS</tspan></text>
  <text x="28" y="390" font-size="15"><tspan fill="#FF2A55" font-weight="700">akash@nixos</tspan><tspan fill="#E6EDF3">:~$ </tspan><tspan fill="#FF2A55" font-weight="700">█<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

</svg>